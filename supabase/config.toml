# Supabase CLI config (local dev + `supabase link`). Project ref is set by `supabase link`.
project_id = "groundwork"

[api]
port = 54321
schemas = ["public"]
max_rows = 200

[db]
port = 54322
major_version = 17

[auth]
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://localhost:3000/auth/callback", "groundwork://auth/callback"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
enable_signup = true
minimum_password_length = 10

[auth.email]
enable_signup = true
enable_confirmations = true
double_confirm_changes = true
secure_password_change = true

[auth.rate_limit]
email_sent = 4
sign_in_sign_ups = 30
token_verifications = 30

[storage]
file_size_limit = "2MiB"

[functions.think]
verify_jwt = true

[functions.delete-account]
verify_jwt = true

[functions.notify-dispatch]
verify_jwt = false

[functions.think-quick]
verify_jwt = false
